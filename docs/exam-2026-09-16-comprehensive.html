<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprehensive Knowledge Exam — 2026-09-16</title>
<style>
html,body{margin:0;padding:0;background:#0b1020}#examframe{display:block;width:100%;border:0;min-height:100vh;background:#0b1020}
</style>
</head>
<body>
<iframe id="examframe" src="exam-2026-09-16-comprehensive-base.html" title="Comprehensive Daily Knowledge Exam"></iframe>
<script>
const f=document.getElementById('examframe');
f.addEventListener('load',()=>{
  const d=f.contentDocument;
  const style=d.createElement('style');
  style.textContent=`
    .check-answer{width:auto!important;display:inline-block;margin-top:10px;padding:9px 14px!important;border-radius:9px!important;font-size:.95rem!important;background:transparent!important;color:var(--accent)!important;border:1px solid var(--accent)!important;font-weight:700!important}
    .check-answer:hover{background:var(--accent)!important;color:#082032!important}
    .check-feedback{margin-top:8px;font-weight:700}
    .check-feedback.good{color:var(--good)}
    .check-feedback.bad{color:var(--bad)}
    .check-feedback.muted{color:var(--muted)}
  `;
  d.head.appendChild(style);

  d.querySelectorAll('.question').forEach(q=>{
    if(q.querySelector('.check-answer')) return;
    const btn=d.createElement('button');
    btn.type='button';
    btn.className='check-answer';
    btn.textContent='Check Answer';
    const feedback=d.createElement('div');
    feedback.className='check-feedback';
    const explanation=q.querySelector('.explanation');
    q.insertBefore(btn,explanation);
    q.insertBefore(feedback,explanation);

    btn.addEventListener('click',()=>{
      const labels=[...q.querySelectorAll('.option')];
      const selected=q.querySelector('input:checked');
      const answerText=explanation?.querySelector('strong')?.textContent || '';
      const match=answerText.match(/Answer:\s*([A-Z])\./i);
      if(!match){feedback.className='check-feedback bad';feedback.textContent='Unable to determine the keyed answer for this question.';return;}
      const correctIndex=match[1].toUpperCase().charCodeAt(0)-65;
      labels.forEach(l=>l.classList.remove('correct','incorrect'));
      if(correctIndex>=0 && correctIndex<labels.length) labels[correctIndex].classList.add('correct');
      if(!selected){
        feedback.className='check-feedback muted';
        feedback.textContent='Select an answer first.';
        return;
      }
      const chosen=Number(selected.value);
      if(chosen===correctIndex){
        feedback.className='check-feedback good';
        feedback.textContent='Correct.';
      }else{
        if(labels[chosen]) labels[chosen].classList.add('incorrect');
        feedback.className='check-feedback bad';
        feedback.textContent='Incorrect. The correct answer is highlighted below.';
      }
      explanation.classList.add('show');
      resize();
    });
  });

  const resize=()=>{try{f.style.height=(d.documentElement.scrollHeight+20)+'px'}catch(e){}};
  resize();
  new ResizeObserver(resize).observe(d.documentElement);
  setTimeout(resize,250);
});
</script>
</body>
</html>
