<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Knowledge Exam — 2026-09-17</title><style>
:root{--b:#0b1020;--c:#131a2b;--t:#eef3ff;--m:#9fb0d0;--a:#7dd3fc;--g:#86efac;--r:#fca5a5;--d:#2b3654}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.55 system-ui}main{max-width:1120px;margin:auto;padding:24px}.hero,.q,#score{background:var(--c);border:1px solid var(--d);border-radius:14px;padding:18px;margin:14px 0}.meta{color:var(--m)}h2{margin-top:38px}.opt{display:block;border:1px solid var(--d);border-radius:9px;padding:10px;margin:7px 0}.correct{border-color:var(--g)!important}.wrong{border-color:var(--r)!important}.exp,.fb{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#0d1528}.show{display:block}.check,.submit{padding:10px 14px;border:0;border-radius:9px;background:var(--a);color:#082032;font-weight:800;cursor:pointer}.check{width:auto;margin-top:8px}.submit{width:100%;font-size:1.05rem;margin-top:24px}#score{display:none;position:sticky;top:8px;z-index:5}#score.show{display:block}a{color:var(--a)}img.exhibit{max-width:100%;border-radius:10px;border:1px solid var(--d);margin:12px 0}</style></head><body><main>
<section class="hero"><h1>Daily Knowledge Exam — 2026-09-17</h1><p id="intro">Loading question bank…</p><p class="meta">This page automatically loads <code>questions-bank/exam-YYYY-MM-DD.json</code> for its own filename, then loads the bank named by that manifest.</p></section>
<div id="score"></div><div id="questions"></div><button class="submit" id="submit" hidden>Submit All</button>
<script>
let Q=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const file=location.pathname.split('/').pop()||'';
 const m=file.match(/^exam-(\\d{4}-\\d{2}-\\d{2})\\.html$/);
 if(!m) throw new Error('This page must be named exam-YYYY-MM-DD.html');
 const examDate=m[1];
 const manifestUrl='questions-bank/exam-'+examDate+'.json';
 const manifestResp=await fetch(manifestUrl,{cache:'no-store'});
 if(!manifestResp.ok) throw new Error('Daily manifest not found: '+manifestUrl+' (HTTP '+manifestResp.status+')');
 const sel=await manifestResp.json();
 const bankUrl='questions-bank/'+(sel.bank||'master.json');
 const bankResp=await fetch(bankUrl,{cache:'no-store'});
 if(!bankResp.ok) throw new Error('Question bank not found: '+bankUrl+' (HTTP '+bankResp.status+')');
 const bank=await bankResp.json();

 const byId=new Map((bank.questions||[]).map(q=>[q.id,q]));
 const missing=(sel.question_ids||[]).filter(id=>!byId.has(id));
 if(missing.length) throw new Error('Manifest references missing question IDs: '+missing.slice(0,10).join(', ')+(missing.length>10?'…':''));
 Q=(sel.question_ids||[]).map(id=>byId.get(id));

 document.title=(sel.title||('Daily Knowledge Exam — '+examDate));
 document.querySelector('.hero h1').textContent=(sel.title||('Daily Knowledge Exam — '+examDate));
 document.getElementById('intro').textContent=
   Q.length+' questions loaded from '+manifestUrl+' using '+bankUrl+'. '+
   'The dated JSON controls which questions appear; the bank stores the reusable question content.';

 let out='',last='';
 Q.forEach((q,i)=>{
   if(q.topic!==last){out+='<h2>'+esc(q.topic)+'</h2>';last=q.topic;}
   const img=q.exhibit&&q.exhibit.image_url
     ?'<figure><img class="exhibit" src="'+esc(q.exhibit.image_url)+'" alt="'+esc(q.exhibit.alt||'Question exhibit')+'" loading="lazy"><figcaption>'+
       esc(q.exhibit.caption||'')+(q.exhibit.source_url?' — <a target="_blank" rel="noopener" href="'+esc(q.exhibit.source_url)+'">source</a>':'')+
       '</figcaption></figure>'
     :'';
   out+='<section class="q" id="q'+i+'"><h3>'+(i+1)+'. '+esc(q.stem)+'</h3>'+img+
     q.options.map((o,j)=>'<label class="opt" id="q'+i+'o'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+
     '<button type="button" class="check" onclick="checkOne('+i+')">Check Answer</button><div class="fb" id="fb'+i+'"></div><div class="exp" id="ex'+i+'"><b>Explanation:</b> '+esc(q.explanation)+'</div></section>';
 });
 document.getElementById('questions').innerHTML=out;
 document.getElementById('submit').hidden=false;
 document.getElementById('submit').onclick=submitAll;
}
function checkOne(i){const q=Q[i],s=document.querySelector('input[name="q'+i+'"]:checked'),fb=document.getElementById('fb'+i),ex=document.getElementById('ex'+i);if(!s){fb.textContent='Select an answer first.';fb.className='fb show';return;}document.querySelectorAll('input[name="q'+i+'"]').forEach(el=>el.closest('.opt').classList.remove('correct','wrong'));document.getElementById('q'+i+'o'+q.answer_index).classList.add('correct');const v=+s.value;if(v===q.answer_index)fb.textContent='Correct.';else{document.getElementById('q'+i+'o'+v).classList.add('wrong');fb.textContent='Incorrect. Correct answer: '+q.options[q.answer_index];}fb.className='fb show';ex.className='exp show';}
function submitAll(){let score=0;Q.forEach((q,i)=>{const s=document.querySelector('input[name="q'+i+'"]:checked');if(s&&+s.value===q.answer_index)score++;checkOne(i)});const box=document.getElementById('score');box.className='hero show';box.innerHTML='<h2>Score: '+score+' / '+Q.length+' ('+Math.round(score*100/Q.length)+'%)</h2>';window.scrollTo({top:0,behavior:'smooth'});}
load().catch(e=>{document.getElementById('intro').textContent='Unable to assemble this exam from its dated JSON manifest: '+e.message;});
</script></main></body></html>
