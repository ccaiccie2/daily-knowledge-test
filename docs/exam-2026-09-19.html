<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Daily Knowledge Exam — 2026-09-19</title><style>:root{--b:#0b1020;--c:#131a2b;--t:#eef3ff;--m:#9fb0d0;--a:#7dd3fc;--g:#86efac;--r:#fca5a5;--d:#2b3654}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.55 system-ui}main{max-width:1120px;margin:auto;padding:24px}.hero,.q,#score{background:var(--c);border:1px solid var(--d);border-radius:14px;padding:18px;margin:14px 0}.meta{color:var(--m)}h2{margin-top:38px}.opt{display:block;border:1px solid var(--d);border-radius:9px;padding:10px;margin:7px 0}.correct{border-color:var(--g)!important}.wrong{border-color:var(--r)!important}.exp,.fb{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#0d1528}.show{display:block}.check,.submit{padding:10px 14px;border:0;border-radius:9px;background:var(--a);color:#082032;font-weight:800;cursor:pointer}.check{width:auto;margin-top:8px}.submit{width:100%;font-size:1.05rem;margin-top:24px}#score{display:none;position:sticky;top:8px;z-index:5}#score.show{display:block}a{color:var(--a)}img.exhibit{max-width:100%;border-radius:10px;border:1px solid var(--d);margin:12px 0}.memory-refresh{margin-top:10px;padding:10px;border-left:3px solid var(--a);background:#0d1528;border-radius:8px}.memory-refresh a{font-weight:700}</style></head><body><main><section class="hero"><h1>Daily Knowledge Exam — 2026-09-19 <small style="font-size:.55em;color:var(--m)">build 2026-09-19b</small></h1><p id="intro">Loading question bank…</p><p class="meta">This page explicitly loads <code>questions-bank/exam-2026-09-19.json</code>. After checking each answer, use the Memory Refresh link to revisit the exact source article.</p></section><div id="score"></div><div id="questions"></div><button class="submit" id="submit" hidden>Submit All</button><script>
let Q=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const manifestUrl='questions-bank/exam-2026-09-19.json';const mr=await fetch(manifestUrl,{cache:'no-store'});if(!mr.ok)throw new Error('Daily manifest not found: '+manifestUrl+' (HTTP '+mr.status+')');const sel=await mr.json();const bankUrl='questions-bank/'+sel.bank;const br=await fetch(bankUrl,{cache:'no-store'});if(!br.ok)throw new Error('Question bank not found: '+bankUrl+' (HTTP '+br.status+')');const bank=await br.json();const byId=new Map((bank.questions||[]).map(q=>[q.id,q]));const missing=(sel.question_ids||[]).filter(id=>!byId.has(id));if(missing.length)throw new Error('Manifest references missing IDs: '+missing.join(', '));Q=sel.question_ids.map(id=>byId.get(id));document.getElementById('intro').textContent=Q.length+' questions loaded from '+bankUrl+'.';let out='',last='';Q.forEach((q,i)=>{if(q.topic!==last){out+='<h2>'+esc(q.topic)+'</h2>';last=q.topic;}const img=q.exhibit&&q.exhibit.image_url?'<figure><img class="exhibit" src="'+esc(q.exhibit.image_url)+'" alt="'+esc(q.exhibit.alt||'Question exhibit')+'" loading="lazy"><figcaption>'+esc(q.exhibit.caption||'')+(q.exhibit.source_url?' — <a target="_blank" rel="noopener" href="'+esc(q.exhibit.source_url)+'">source</a>':'')+'</figcaption></figure>':'';out+='<section class="q" id="q'+i+'"><h3>'+(i+1)+'. '+esc(q.stem)+'</h3>'+img+q.options.map((o,j)=>'<label class="opt" id="q'+i+'o'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('')+'<button type="button" class="check" onclick="checkOne('+i+')">Check Answer</button><div class="fb" id="fb'+i+'"></div><div class="exp" id="ex'+i+'"></div><div class="memory-refresh" id="mr'+i+'" style="display:none"></div></section>';});document.getElementById('questions').innerHTML=out;document.getElementById('submit').hidden=false;document.getElementById('submit').onclick=submitAll;}
function checkOne(i){const q=Q[i],mr=document.getElementById('mr'+i),s=document.querySelector('input[name="q'+i+'"]:checked'),fb=document.getElementById('fb'+i),ex=document.getElementById('ex'+i);if(!s){fb.textContent='Select an answer first.';fb.className='fb show';return;}document.querySelectorAll('input[name="q'+i+'"]' ).forEach(el=>el.closest('.opt').classList.remove('correct','wrong'));document.getElementById('q'+i+'o'+q.answer_index).classList.add('correct');const v=+s.value,r=Array.isArray(q.option_explanations)?q.option_explanations:[];if(v===q.answer_index){fb.innerHTML='<b>Correct.</b><br>'+esc(r[v]||q.explanation||'');}else{document.getElementById('q'+i+'o'+v).classList.add('wrong');fb.innerHTML='<b>Incorrect.</b><br><strong>Why your answer is wrong:</strong> '+esc(r[v]||'That option does not fit the evidence.')+'<br><br><strong>Correct answer:</strong> '+esc(q.options[q.answer_index])+'<br><strong>Why it is correct:</strong> '+esc(r[q.answer_index]||q.explanation||'');}fb.className='fb show';ex.innerHTML='<b>Concept reinforcement:</b> '+esc(q.explanation||'');ex.className='exp show';if(mr){const ref=q.memory_refresh||{};const article=ref.article||q.source_title||q.source_article||'Knowledge article';const section=ref.section||q.source_section||'';const url=ref.url||q.source_url||'';mr.innerHTML='<b>Memory Refresh:</b><br><strong>'+esc(article)+'</strong>'+(section?'<br>Review: '+esc(section):'')+(url?'<br><a target="_blank" rel="noopener" href="'+esc(url)+'">Open source article</a>':'');mr.style.display='block';}}
function submitAll(){let score=0;Q.forEach((q,i)=>{const s=document.querySelector('input[name="q'+i+'"]:checked');if(s&&+s.value===q.answer_index)score++;checkOne(i)});const box=document.getElementById('score');box.className='hero show';box.innerHTML='<h2>Score: '+score+' / '+Q.length+' ('+Math.round(score*100/Q.length)+'%)</h2>';window.scrollTo({top:0,behavior:'smooth'});}load().catch(e=>{document.getElementById('intro').textContent='Unable to assemble this exam from its dated JSON manifest: '+e.message;});
</script></main></body></html>
