<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Daily Knowledge Exam — 2026-09-23</title><style>body{font:16px system-ui;max-width:1000px;margin:auto;padding:24px}.q{border:1px solid #aaa;padding:16px;margin:12px}.fb,.mem{padding:10px;margin-top:8px;background:#eee;color:#111}.mem{border-left:3px solid #48a}label{display:block;margin:6px 0}button{padding:8px 12px;margin-top:8px}a{color:#1670c5}</style></head><body><h1>Daily Knowledge Exam — 2026-09-23 <small>build 2026-09-23a</small></h1><p>This page explicitly loads <code>questions-bank/exam-2026-09-23.json</code>. Check each answer for a rationale and Memory Refresh link to the originating knowledge article.</p><p id="status">Loading…</p><main id="exam"></main><button id="submit" hidden>Submit All</button><script>const MANIFEST='questions-bank/exam-2026-09-23.json';let Q=[];const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let r=await fetch(MANIFEST,{cache:'no-store'});if(!r.ok)throw Error('manifest HTTP '+r.status);let m=await r.json(),br=await fetch('questions-bank/'+m.bank,{cache:'no-store'});if(!br.ok)throw Error('bank HTTP '+br.status);let b=await br.json(),x=new Map((b.questions||[]).map(q=>[q.id,q])),missing=(m.question_ids||[]).filter(id=>!x.has(id));if(missing.length)throw Error('manifest has unresolved IDs: '+missing.join(','));Q=m.question_ids.map(id=>x.get(id));status.textContent=Q.length+' questions loaded from '+m.bank+'.';exam.innerHTML=Q.map((q,i)=>'<section class=q><h3>'+(i+1)+'. '+E(q.stem)+'</h3>'+q.options.map((o,j)=>'<label><input type=radio name=q'+i+' value='+j+'> '+String.fromCharCode(65+j)+'. '+E(o)+'</label>').join('')+'<button type=button data-i='+i+'>Check Answer</button><div id=f'+i+'></div><div id=m'+i+'></div></section>').join('');submit.hidden=false;exam.onclick=e=>{if(e.target.dataset.i!==undefined)check(+e.target.dataset.i)}}function check(i){let q=Q[i],s=document.querySelector('input[name=q'+i+']:checked'),f=document.getElementById('f'+i),m=document.getElementById('m'+i);if(!s){f.className='fb';f.textContent='Select an answer first.';return false}let v=+s.value,r=q.option_explanations||[];f.className='fb';f.innerHTML=v===q.answer_index?'<b>Correct.</b><br>'+E(r[v]||q.explanation):'<b>Incorrect.</b><br><b>Why your choice is wrong:</b> '+E(r[v]||'That option does not fit the scenario evidence.')+'<br><br><b>Correct answer:</b> '+E(q.options[q.answer_index])+'<br><b>Why it is correct:</b> '+E(r[q.answer_index]||q.explanation);let z=q.memory_refresh||{};m.className='mem';m.innerHTML='<b>Memory Refresh:</b><br><strong>'+E(z.article||q.source_title||q.source_article)+'</strong>'+(z.section?'<br>Review: '+E(z.section):'')+(z.url?'<br><a target=_blank rel=noopener href="'+E(z.url)+'">Open source article</a>':'');return v===q.answer_index}submit.onclick=()=>{let n=0;Q.forEach((q,i)=>{if(check(i))n++});status.innerHTML='<b>Score: '+n+' / '+Q.length+'</b>';scrollTo({top:0,behavior:'smooth'})};load().catch(e=>status.textContent='Unable to assemble exam: '+e.message)</script></body></html>
